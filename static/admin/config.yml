backend:
  name: github
  repo: athiengwek/my-website
  branch: main # Branch to update (optional; defaults to master)
  site_domain: athiengwek.com
  base_url: https://www.athiengwek.com
  auth_endpoint: /api/auth

media_folder: static/img

# Tell Decap CMS where public images are served from
public_folder: "https://media.athiengwek.com"

# Use S3 / R2 for media storage instead of saving files inside static/
media_library:
  name: s3
  config:
    bucket: my-website-media
    region: auto
    endpoint: "/api/upload"

collections:
  - name: 'blog'
    label: 'Blog'
    folder: 'content/blog'
    create: true
    slug: '{{slug}}'
    editor:
      preview: false
    fields:
      - { label: 'Title', name: 'title', widget: 'string' }
      - { label: 'Publish Date', name: 'date', widget: 'datetime' }
      - { label: 'Description', name: 'description', widget: 'string' }
      - { label: 'Body', name: 'body', widget: 'markdown' }
